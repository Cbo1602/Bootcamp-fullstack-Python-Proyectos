{% extends 'base.html' %}
{% block title %}Eliminar tarea{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h2 class="mb-4">Eliminar tarea</h2>
        <p>¿Seguro que querés eliminar la tarea <strong>{{ object.titulo }}</strong>?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Sí, eliminar</button>
            <a href="{% url 'tasks:proyecto_detalle' object.proyecto.pk %}" class="btn btn-link">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
