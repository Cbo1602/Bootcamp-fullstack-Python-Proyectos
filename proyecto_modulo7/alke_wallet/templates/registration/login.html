{% extends "base.html" %}
{% block title %}Iniciar sesión · Alke Wallet{% endblock %}
{% block content %}
<div class="row justify-content-center mt-4">
  <div class="col-md-6 col-lg-4">
    <div class="wallet-card mb-4">
      <div class="moneda">Alke Financial</div>
      <div class="saldo">Tu billetera, a la mano</div>
    </div>
    <div class="card panel"><div class="card-body p-4">
      <h1 class="h4 titulo mb-3">Iniciar sesión</h1>
      <form method="post">{% csrf_token %}
        {% if form.errors %}<div class="alert alert-danger">Usuario o contraseña incorrectos.</div>{% endif %}
        <div class="mb-3"><label class="form-label" for="id_username">Usuario</label>
          <input type="text" name="username" id="id_username" class="form-control" autofocus required></div>
        <div class="mb-3"><label class="form-label" for="id_password">Contraseña</label>
          <input type="password" name="password" id="id_password" class="form-control" required></div>
        <input type="hidden" name="next" value="{{ next }}">
        <button class="btn btn-primary w-100">Entrar</button>
      </form>
    </div></div>
  </div>
</div>
{% endblock %}
