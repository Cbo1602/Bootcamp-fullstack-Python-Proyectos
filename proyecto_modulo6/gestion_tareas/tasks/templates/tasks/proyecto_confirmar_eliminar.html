{% extends 'base.html' %}
{% block title %}Eliminar proyecto{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h2 class="mb-4">Eliminar proyecto</h2>
        <p>¿Seguro que querés eliminar el proyecto <strong>{{ object.nombre }}</strong>? Se eliminarán también todas sus tareas.</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Sí, eliminar</button>
            <a href="{% url 'tasks:proyecto_lista' %}" class="btn btn-link">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
