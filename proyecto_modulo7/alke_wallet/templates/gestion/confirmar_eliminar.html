{% extends "base.html" %}
{% block title %}Eliminar · Alke Wallet{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-5">
  <div class="card panel"><div class="card-body p-4">
    <h1 class="h4 titulo mb-3">¿Eliminar este registro?</h1>
    <p class="mb-1"><strong>{{ object }}</strong></p>
    {% if aviso %}<p class="text-muted">{{ aviso }}</p>{% endif %}
    <form method="post" class="mt-3">{% csrf_token %}
      <button class="btn btn-danger">Sí, eliminar</button>
      <a class="btn btn-outline-secondary ms-2" href="{{ volver }}">Cancelar</a>
    </form>
  </div></div>
</div></div>
{% endblock %}
